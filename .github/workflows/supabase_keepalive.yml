name: Supabase Keep-Alive Anti-Sleep

on:
  schedule:
    # Berjalan setiap 3 hari pada pukul 00:00 UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Memungkinkan trigger manual via tombol di GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets SUPABASE_URL atau SUPABASE_ANON_KEY belum diset di GitHub Repo Settings -> Secrets. Melewati ping."
            exit 0
          fi
          echo "Mengirim ping keep-alive ke Supabase..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1")
          echo "Status HTTP Response: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 204 ]; then
            echo "Ping berhasil! Supabase tetap aktif dan tidak akan pernah sleep/pause."
          else
            echo "Warning: Response status bukan 200 ($HTTP_STATUS), tapi traffic request tetap tercatat di Supabase."
          fi
